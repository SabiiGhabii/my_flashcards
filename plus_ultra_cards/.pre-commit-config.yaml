repos:
  - repo: https://github.com/psf/black
    rev: 23.3.0
    hooks:
      - id: black
        language_version: python3
        args: [--line-length=100]

  - repo: https://github.com/pycqa/flake8
    rev: 6.0.0
    hooks:
      - id: flake8
        args: [--max-line-length=100, --ignore=E203,W503]

  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        args: [--profile=black, --line-length=100]

  - repo: local
    hooks:
      - id: pytest-core
        name: pytest-core
        entry: python -m pytest tests/test_formatter_service_facade.py tests/test_card_type_registry.py tests/test_srs_factory.py tests/test_card_service.py -v
        language: system
        pass_filenames: false
        always_run: true
